name: Android Native Gate

on:
  pull_request:
    branches:
      - agent/fullstack-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure Android SDK 36 and Expo SDK 57 NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo 'ANDROID_NATIVE_GATE=PASS'
          du -h "$APK"

      - name: Publish debug APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: glicocontrol-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
