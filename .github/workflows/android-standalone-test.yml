name: Android Standalone Test APK

on:
  pull_request:
    branches:
      - agent/fullstack-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate canonical buffer dependency lock
        run: npm install --package-lock-only --ignore-scripts --save-exact buffer@6.0.3

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish generated dependency lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: buffer-release-lockfiles
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Ensure Android SDK 36 and Expo SDK 57 NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.1.12297006'

      - name: Generate native Android project
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_DEMO_MODE: demo-local
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile standalone release APK
        working-directory: android
        env:
          CI: '1'
          NODE_ENV: production
          EXPO_PUBLIC_DEMO_MODE: demo-local
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify standalone APK
        shell: bash
        run: |
          set -euo pipefail
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"

          # Release must carry the JS bundle so it can run without Metro.
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'

          # Test APK must also be installable/signed. Expo prebuild uses the
          # local debug keystore for this non-production release gate.
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

          echo 'ANDROID_STANDALONE_GATE=PASS'
          du -h "$APK"

      - name: Publish standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: glicocontrol-standalone-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
