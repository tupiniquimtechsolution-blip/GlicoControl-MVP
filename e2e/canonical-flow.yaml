# Fluxo canônico E2E (Maestro) — exige device/emulador com o app (não roda neste sandbox).
# Uso:  npx expo start (ou dev build)  &&  maestro test e2e/canonical-flow.yaml
# Seletores = textos/labels reais das telas + testIDs (login-*, register-value, glucose-value,
# reminder-label, medication-name). Ver e2e/README.md.
appId: app.tupiniquim.glicocontrol
---
- launchApp
# 1. Login com conta de teste
- tapOn:
    id: "login-email"
- inputText: "e2e@glicocontrol.test"
- tapOn:
    id: "login-password"
- inputText: "senha-de-teste-123"
- tapOn: "Entrar"
# 2. Dashboard carregado
- assertVisible: "Registrar glicemia"
# 3. Registrar medição pelo atalho do dashboard
- tapOn: "➕ Registrar medição"
- tapOn:
    id: "register-value"
- inputText: "112"
- tapOn: "Salvar medição"
- assertVisible: "Medição salva."
# 4. Dashboard reflete a última medição
- tapOn: "Início"
- assertVisible: "Última medição"
- assertVisible: "112"
# 5. Calendário marca o dia com registros
- tapOn: "Calendário"
- assertVisible: "Calendário"
# 6. Lembrete novo (dias + hora)
- tapOn: "Lembretes"
- tapOn: "➕ Criar lembrete"
- tapOn:
    id: "reminder-label"
- inputText: "Glicemia matinal"
- tapOn: "Salvar"
- assertVisible: "Glicemia matinal"
# 7. Medicamento + log de adesão manual por toque
- tapOn: "Gerenciar medicamentos"
- tapOn: "Salvar"            # abre form; botão principal da tela de medicações
- tapOn:
    id: "medication-name"
- inputText: "Metformina"
- tapOn: "Salvar"
- assertVisible: "Metformina"
- tapOn: "✓ Tomei"
# 8. Relatório do mês → PDF no aparelho → compartilhar (toque explícito)
- tapOn: "Relatórios"
- tapOn: "🖨 Gerar PDF (no meu aparelho)"
- assertVisible: "Gerado com sucesso"
