# Fluxo canônico E2E (Maestro) para build de desenvolvimento com
# EXPO_PUBLIC_DEMO_MODE=demo-local. O modo demo é DEV-only e mantém dados no aparelho.
# Para Supabase real, Auth/RLS/sync têm gates separados e não usam estas credenciais fictícias.
appId: app.tupiniquim.glicocontrol
---
- launchApp:
    clearState: true

# 1. Entrada pelo fluxo real de navegação: boas-vindas → login
- assertVisible: "GlicoControl"
- tapOn: "Já tenho conta — Entrar"
- tapOn:
    id: "login-email"
- inputText: "e2e@glicocontrol.test"
- tapOn:
    id: "login-password"
- inputText: "senha-de-teste-123"
- tapOn: "Entrar"

# 2. Dashboard carregado
- assertVisible: "Última medição"
- assertVisible: "➕ Registrar medição"

# 3. Registrar medição pelo atalho do dashboard
- tapOn: "➕ Registrar medição"
- tapOn:
    id: "register-value"
- inputText: "112"
- tapOn: "Salvar medição"
- assertVisible: "Medição salva."

# 4. Dashboard reflete a última medição
- assertVisible: "Última medição"
- assertVisible: "112"

# 5. Calendário marca o dia com registros
- tapOn: "Calendário"
- assertVisible: "Calendário"

# 6. Lembrete novo
- tapOn: "Lembretes"
- tapOn: "➕ Criar lembrete"
- tapOn:
    id: "reminder-label"
- inputText: "Glicemia matinal"
- tapOn: "Salvar"
- assertVisible: "Glicemia matinal"

# 7. Medicamento + log de adesão manual por toque
- tapOn: "Início"
- tapOn: "Gerenciar medicamentos"
- tapOn: "Cadastrar medicamento"
- tapOn:
    id: "medication-name"
- inputText: "Metformina"
- tapOn: "Dose (texto livre)"
- inputText: "1 comprimido"
- tapOn: "Salvar"
- assertVisible: "Metformina"
- tapOn: ".*Tomei.*"
- assertVisible: "Ação “Tomei” registrada por você."

# 8. Relatório do mês → PDF no aparelho
- back
- tapOn: "Relatórios"
- tapOn: "Abrir relatório deste mês"
- tapOn: "🖨 Gerar PDF (no meu aparelho)"
- assertVisible: "PDF gerado neste dispositivo."
